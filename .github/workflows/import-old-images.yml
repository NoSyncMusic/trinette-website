name: Import images from old Trinette site

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/import-old-images.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: python -m pip install --quiet requests beautifulsoup4 pillow

      - name: Download artwork through WordPress media API
        shell: python
        run: |
          import io
          import os
          import json
          from urllib.parse import urlparse
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image

          slugs = {
              "yara-azra": "yara-en-azra-in-pastel",
              "enzi": "enzi-in-pastel",
              "jacky": "jacky-in-pastel",
              "carla-louise-frits": "carla-louise-en-frits-in-pastel",
              "ocean": "portret-ocean",
              "bowy": "portret-bowy",
              "klaprozen": "klaprozen-in-pastel",
              "ijsvogel": "ijsvogel-olieverfschilderij",
              "manderijn": "manderijn-olieverfschilderij",
          }

          base = "https://trinettedenhamer.nl"
          api = base + "/wp-json/wp/v2"
          session = requests.Session()
          session.headers.update({"User-Agent": "Mozilla/5.0 TrinetteSiteMigration/1.1"})

          out_dir = "assets/artwork"
          os.makedirs(out_dir, exist_ok=True)
          manifest = {}

          def image_info(url):
              r = session.get(url, timeout=30)
              r.raise_for_status()
              im = Image.open(io.BytesIO(r.content))
              return im.width, im.height, im.format, r.content

          def add_candidate(candidates, url, width=0, height=0):
              if not url:
                  return
              if url.startswith("//"):
                  url = "https:" + url
              if url.startswith("/"):
                  url = base + url
              if "trinettedenhamer.nl" not in urlparse(url).netloc:
                  return
              if "/wp-content/uploads/" not in url:
                  return
              candidates[url] = max(candidates.get(url, (0,0)), (int(width or 0), int(height or 0)))

          for key, slug in slugs.items():
              print("\n---", key, slug)
              pr = session.get(
                  api + "/posts",
                  params={"slug": slug, "_embed": "1", "per_page": 1},
                  timeout=30
              )
              print("posts api", pr.status_code, pr.url)
              pr.raise_for_status()
              posts = pr.json()
              if not posts:
                  print("No post found")
                  continue

              post = posts[0]
              post_id = post["id"]
              candidates = {}

              # Featured media
              embedded = post.get("_embedded", {})
              for fm in embedded.get("wp:featuredmedia", []) or []:
                  details = fm.get("media_details") or {}
                  add_candidate(candidates, fm.get("source_url"), details.get("width"), details.get("height"))
                  for size in (details.get("sizes") or {}).values():
                      add_candidate(candidates, size.get("source_url"), size.get("width"), size.get("height"))

              # Images embedded in post body
              html = (post.get("content") or {}).get("rendered") or ""
              soup = BeautifulSoup(html, "html.parser")
              for img in soup.find_all("img"):
                  add_candidate(candidates, img.get("src"), img.get("width"), img.get("height"))
                  srcset = img.get("srcset")
                  if srcset:
                      for part in srcset.split(","):
                          bits = part.strip().split()
                          if not bits:
                              continue
                          width = 0
                          if len(bits) > 1 and bits[1].endswith("w"):
                              try: width = int(bits[1][:-1])
                              except: pass
                          add_candidate(candidates, bits[0], width, 0)

              # Media explicitly attached to this post
              mr = session.get(
                  api + "/media",
                  params={"parent": post_id, "per_page": 100},
                  timeout=30
              )
              print("media api", mr.status_code, mr.url)
              if mr.ok:
                  for media in mr.json():
                      details = media.get("media_details") or {}
                      add_candidate(candidates, media.get("source_url"), details.get("width"), details.get("height"))
                      for size in (details.get("sizes") or {}).values():
                          add_candidate(candidates, size.get("source_url"), size.get("width"), size.get("height"))

              print("candidate urls", len(candidates))
              best = None
              for url, hinted in candidates.items():
                  try:
                      w, h, fmt, data = image_info(url)
                      print("candidate", w, h, url)
                      if w < 500 or h < 350:
                          continue
                      score = w * h
                      if best is None or score > best[0]:
                          best = (score, w, h, fmt, data, url)
                  except Exception as e:
                      print("skip", url, repr(e))

              if best is None:
                  print("No suitable image found for", key)
                  continue

              _, w, h, fmt, data, source_url = best
              ext = {"JPEG": ".jpg", "PNG": ".png", "WEBP": ".webp"}.get((fmt or "").upper(), ".jpg")
              dest = f"{out_dir}/{key}{ext}"
              with open(dest, "wb") as fh:
                  fh.write(data)

              manifest[key] = {
                  "file": dest,
                  "source_page": f"{base}/{slug}/",
                  "source_image": source_url,
                  "width": w,
                  "height": h
              }
              print("SAVED", dest, w, h)

          with open(f"{out_dir}/manifest.json", "w", encoding="utf-8") as fh:
              json.dump(manifest, fh, indent=2, ensure_ascii=False)

          print("\nImported:", list(manifest))
          if len(manifest) < 4:
              raise SystemExit(f"Only found {len(manifest)} usable artwork images; refusing incomplete import.")

      - name: Commit imported images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/artwork
          if git diff --cached --quiet; then
            echo "No image changes to commit"
            exit 0
          fi
          git commit -m "Import artwork from existing Trinette website"
          git push
